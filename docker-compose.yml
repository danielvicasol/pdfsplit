version: '3.8'

services:
  pdfsplit:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
      - /tmp/streamlit:/tmp/streamlit
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_CLIENT_TOOLBAR_MODE=auto
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
